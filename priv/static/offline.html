<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Keepsake</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; background: #F5F6F8; color: #1B1E27; text-align: center; padding: 16px;
      }
      @media (prefers-color-scheme: dark) { body { background: #14161C; color: #B8BDC8; } }
      h1 { font-size: 28px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; }
      button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: #1F5F5B; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/icons/icon-192.png" width="96" height="96" alt="" />
      <h1>You're offline</h1>
      <p>Keepsake needs a connection to open albums. Check your signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
