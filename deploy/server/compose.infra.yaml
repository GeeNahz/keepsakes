# What every environment on this server shares: the edge (OpenResty, ports
# 80/443), Postgres (one database per environment), nightly backups and,
# when switched on, the metrics profile. Project name: ks-infra.
#
# Don't run this by hand; the scripts in bin/ pass the right project name,
# files and settings:
#   bin/infra-up <tag>     update the edge and backup images (production deploys)
#   bin/metrics on|off     Prometheus + Grafana + Uptime Kuma
#
# Settings: /srv/keepsakes/infra/.env (env/infra.env.example). The apps run
# as their own projects (compose.app.yaml) and join the `keepsakes` network
# made here, so this one must be up first.
#
# Staging later on its own server: run this file there too, with only
# staging's database password, APP_UPSTREAM=app-staging:4000 and
# STAGING_HOSTS empty. See DEPLOYMENT.md, "Moving staging to its own server".

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  openresty:
    image: ${KS_REGISTRY:-ghcr.io/geenahz}/keepsakes-edge:${INFRA_TAG:?set by bin/infra-up}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      # Hostnames go to production unless listed in STAGING_HOSTS. A server
      # that only runs staging sets APP_UPSTREAM=app-staging:4000 instead
      APP_UPSTREAM: ${APP_UPSTREAM:-app-production:4000}
      STAGING_UPSTREAM: app-staging:4000
      STAGING_HOSTS: ${STAGING_HOSTS:-}
      # Unset = Let's Encrypt production. Its staging CA while testing:
      # https://acme-staging-v02.api.letsencrypt.org/directory
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      # The same value as both apps' TLS_ASK_TOKEN
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:-}
    volumes:
      - certs:/var/lib/acme
    networks: [keepsakes]
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Read once by postgres/init.sh, when the volume is first created
      PRODUCTION_DB_PASSWORD: ${PRODUCTION_DB_PASSWORD:-}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD:-}
    # Sized for a 2-4 GB droplet shared with the apps; raise with the droplet
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      # Each app's pool (POOL_SIZE) twice over during a rolling deploy, plus
      # Oban, backups and a console
      - -c
      - max_connections=80
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-keepsakes.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only the apps and backups on this network reach it
    networks: [keepsakes]
    shm_size: 128mb
    restart: unless-stopped
    logging: *logging

  backup:
    image: ${KS_REGISTRY:-ghcr.io/geenahz}/keepsakes-backup:${INFRA_TAG:?set by bin/infra-up}
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DATABASES: ${BACKUP_DATABASES:-production=keepsakes_prod staging=keepsakes_staging}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-keepsakes-backups}
      # env=bucket pairs; photos are copied into the backup bucket nightly
      MEDIA_BUCKETS: ${MEDIA_BUCKETS:-}
      # Public key only: backups can be written here, never read
      AGE_RECIPIENT: ${AGE_RECIPIENT:?AGE_RECIPIENT is required}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # rclone's "r2" remote, configured from the environment
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      # Where backups go: "r2" normally (the rehearsal uses a local folder)
      BACKUP_REMOTE: ${BACKUP_REMOTE:-r2}
    volumes:
      - certs:/backup/certs:ro
      - uploads_production:/backup/uploads/production:ro
      - uploads_staging:/backup/uploads/staging:ro
    networks: [keepsakes]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # --- metrics profile: off unless `bin/metrics on` --------------------------
  # Reached through an SSH tunnel only (127.0.0.1 ports); see DEPLOYMENT.md

  prometheus:
    profiles: [metrics]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [keepsakes]
    mem_limit: 300m
    restart: unless-stopped
    logging: *logging

  grafana:
    profiles: [metrics]
    image: grafana/grafana:12.1.0
    environment:
      # Required, but checked by bin/metrics: compose would refuse the whole
      # file without it, even with the profile off
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Write-ahead logging for Grafana's SQLite: without it, its background
      # jobs lock the database and logins fail with "database is locked"
      GF_DATABASE_WAL: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [keepsakes]
    mem_limit: 250m
    restart: unless-stopped
    logging: *logging

  uptime-kuma:
    profiles: [metrics]
    image: louislam/uptime-kuma:1.23.16
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks: [keepsakes]
    mem_limit: 200m
    restart: unless-stopped
    logging: *logging

networks:
  # Fixed name, so the app projects can join it
  keepsakes:
    name: keepsakes

volumes:
  certs:
  pg_data:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  # Local-disk photos (when an environment has no S3_BUCKET). Made here with
  # fixed names so backups can read them; the apps mount them by name
  uploads_production:
    name: keepsakes-uploads-production
  uploads_staging:
    name: keepsakes-uploads-staging
