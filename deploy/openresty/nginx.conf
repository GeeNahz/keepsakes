# OpenResty's main configuration. Site settings live in conf.d/.
worker_processes auto;

error_log /dev/stderr warn;

# Environment variables Lua may read (nginx hides all others from workers)
env TLS_ASK_TOKEN;
env TLS_ASK_TIMEOUT_MS;
env ACME_DIRECTORY_URL;
env ACME_EMAIL;
env ACME_RENEW_DAYS;
env ACME_RENEW_CHECK_SECONDS;
env ACME_NEW_PER_MINUTE;
env ACME_NEW_PER_HOUR;
# Which app each hostname goes to (lua/keepsake/backends.lua)
env APP_UPSTREAM;
env STAGING_HOSTS;
env STAGING_UPSTREAM;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  # Compress text on the way out (pages, JSON, SVG). Digested CSS/JS
  # already arrive gzipped from Phoenix (Plug.Static), which nginx leaves
  # alone. Photos are already compressed. Brotli would need a module the
  # OpenResty image doesn't ship.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml application/manifest+json image/svg+xml;

  # --- Step 4: on-demand TLS (docs/learning/openresty/04-on-demand-tls.md) ---

  # Our Lua modules (lua/keepsake/*.lua)
  lua_package_path "/etc/nginx/lua/?.lua;;";

  # Memory shared by all workers: lua-resty-acme's locks and state, and the
  # app's answers about which names may have certificates
  lua_shared_dict acme 16m;
  lua_shared_dict tls_ask 1m;

  # Docker's built-in DNS server, for Lua's own connections (to the app and
  # the CA) and for proxy_pass, which names the app through a variable
  # ($app_backend) and so looks it up as it goes. Answers are kept 5 s: a
  # rolling deploy adds a container under the same name and then removes
  # the old one, and the edge should notice both quickly.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # The CAs Lua trusts when it talks HTTPS to the ACME server: the system
  # list, plus any extra roots mounted in (Pebble's, locally). Built by
  # entrypoint.sh.
  lua_ssl_trusted_certificate /etc/openresty/tls/trusted.pem;
  lua_ssl_verify_depth 3;

  init_by_lua_block {
    require("resty.acme.autossl").init({
      tos_accepted = true,
      account_email = os.getenv("ACME_EMAIL"),
      -- Kept in the certs volume so we stay the same ACME account
      account_key_path = "/var/lib/acme/account.key",
      domain_key_types = { "ecc" },
      -- Only names the app approves (lua/keepsake/ask.lua)
      domain_whitelist_callback = function(domain, is_new_cert_needed)
        return require("keepsake.ask").allowed(domain, is_new_cert_needed)
      end,
      storage_adapter = "file",
      storage_config = { dir = "/var/lib/acme/certs" },
      -- The first visitor waits a moment for the certificate instead of
      -- getting the fallback one (and a browser warning)
      blocking = true,

      -- Step 5: renewals (docs/learning/openresty/05-storage-and-renewal.md).
      -- Renew once 30 days are left: two thirds through today's 90-day
      -- certificates, as Let's Encrypt advises, and still in time when they
      -- drop to 64 days (Feb 2027) and 45 (Feb 2028).
      renew_threshold = (tonumber(os.getenv("ACME_RENEW_DAYS")) or 30) * 86400,
      -- How often a worker looks through the stored certificates
      renew_check_interval = tonumber(os.getenv("ACME_RENEW_CHECK_SECONDS")) or 6 * 3600,
      -- After a failed order, wait longer each time before trying that name
      -- again: Let's Encrypt allows 5 failures per name per hour, and pauses
      -- a name after many failures in a row (refilling one a day)
      failure_cooloff_callback = function(domain, count)
        if count <= 1 then return 15 * 60 end
        if count == 2 then return 3600 end
        if count == 3 then return 6 * 3600 end
        return 86400
      end,
      -- Never delete stored certificates the app stops approving: they're
      -- just not served or renewed. Deleting would turn an app outage
      -- during a renewal round into reissuing every certificate.
      enabled_delete_not_whitelisted_domain = false,
    }, {
      -- Pebble locally; Let's Encrypt in production (unset = Let's Encrypt)
      api_uri = os.getenv("ACME_DIRECTORY_URL"),
    })
  }

  init_worker_by_lua_block {
    require("resty.acme.autossl").init_worker()
  }

  # $app_backend: which app a hostname goes to, written by entrypoint.sh
  # from APP_UPSTREAM / STAGING_HOSTS / STAGING_UPSTREAM
  include /etc/openresty/generated/*.conf;
  include /etc/nginx/conf.d/*.conf;
}
