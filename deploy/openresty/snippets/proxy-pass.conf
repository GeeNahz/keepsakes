# How a request is handed to Phoenix. Included inside each location that
# proxies (snippets/proxy.conf), so the rate-limited ones behave the same.

proxy_pass http://$app_backend;

# During a rolling deploy the name has two containers behind it. A
# container that's gone (refused, or no answer within 2 s) gets the request
# tried on the other one; nginx never retries a request it already sent
# (a form post), only ones that never got through.
proxy_connect_timeout 2s;
proxy_next_upstream error timeout;

# Pass the hostname the browser asked for, so Phoenix can route by it
proxy_set_header Host $host;

# WebSockets (LiveView) need HTTP/1.1 and the two upgrade headers
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Who's really connecting, and over http or https. We *overwrite*
# X-Forwarded-For with the address we saw instead of appending to it, so a
# visitor can't pretend to be someone else by sending their own
# (KeepsakesWeb.ClientIP trusts this).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# LiveView keeps its socket open; Phoenix pings every 30s, so allow
# quiet periods well beyond that before treating it as dead
proxy_read_timeout 120s;
