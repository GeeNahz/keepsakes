# What every server block does with ordinary requests: hand them to Phoenix.
# Included by both the HTTP and the HTTPS server in conf.d/keepsake.conf.

# Only the app's own private network may ask about certificates; refuse it
# at the edge too, so it's never reachable from the internet. "^~" makes
# this win over the regex locations below (nginx tries regexes before plain
# prefixes otherwise, and /internal/x/access would match one).
location ^~ /internal/ {
  return 404;
}

# Step 6: sign-in forms, main site (/auth/...) and admin portal (/log-in,
# /two-step...). Each POST checks a password or a code, which costs the app
# real work (bcrypt), so floods are turned away here first. The app's own
# limits (per email, per account) still apply behind this.
location ~ ^/(auth/)?(log-in|two-step|restore)(/|$) {
  limit_req zone=sign_in burst=10 nodelay;
  include /etc/nginx/snippets/proxy-pass.conf;
}

# Step 6: access-code entry for shared albums: /a/<slug>/access on our site,
# /<album>/access on a customer's domain. The app allows 5 wrong codes per
# 15 minutes per album and visitor; this stops floods before they get there.
location ~ ^/(a/)?[^/]+/access$ {
  limit_req zone=access_codes burst=10 nodelay;
  include /etc/nginx/snippets/proxy-pass.conf;
}

location / {
  include /etc/nginx/snippets/proxy-pass.conf;
}
