# Every hostname (keepsake.com, admin., customers' domains) comes to these
# server blocks and goes to the same Phoenix app, which decides what to show
# by the Host header. Learning route: docs/learning/openresty/.

# The app: the `app` service in compose.yaml, reached by its name on the
# compose network (looked up once, when OpenResty starts).
upstream phoenix {
  server app:4100;
}

# Step 2: WebSockets. A browser asks to switch an HTTP request to a WebSocket
# with "Connection: Upgrade" + "Upgrade: websocket". nginx doesn't pass those
# hop-by-hop headers on by itself, so we set them: "upgrade" when the browser
# asked for one, otherwise "close" as for any finished request.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Step 6: rate limits per visitor address, for form submissions only.
# Requests whose key is empty aren't counted, so GETs (loading the sign-in
# page, assets) are never limited: only POSTs carry the address.
map $request_method $post_from {
  POST    $binary_remote_addr;
  default "";
}

# 10 a minute per address, on average. With "burst=10 nodelay" (in
# snippets/proxy.conf) up to 10 more can come at once, which leaves room
# for several people behind one mobile carrier address (carrier-grade NAT
# is common). Past that: 429 Too Many Requests.
limit_req_zone $post_from zone=sign_in:10m rate=10r/m;
limit_req_zone $post_from zone=access_codes:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
  listen 80 default_server;
  server_name _;

  # Step 3/4: ACME HTTP-01. The CA fetches
  # http://<host>/.well-known/acme-challenge/<token>; lua-resty-acme answers
  # from the order it's working on, so this never reaches Phoenix.
  location /.well-known/acme-challenge/ {
    content_by_lua_block {
      require("resty.acme.autossl").serve_http_challenge()
    }
  }

  include /etc/nginx/snippets/proxy.conf;
}

# Step 4: HTTPS for every name, with certificates fetched on demand.
server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  # nginx needs a certificate to start; this throwaway one is only used when
  # no real one can be had (a name the app doesn't approve, or no SNI)
  ssl_certificate     /etc/openresty/tls/fallback.crt;
  ssl_certificate_key /etc/openresty/tls/fallback.key;

  # Runs at the start of every handshake: picks the stored certificate for
  # the name the browser asked for (SNI), or asks the app and then the CA
  # for a new one
  ssl_certificate_by_lua_block {
    require("resty.acme.autossl").ssl_certificate()
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  include /etc/nginx/snippets/proxy.conf;
}
